[package]
name = "qs-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm"] }
futures = "0.3"
libc = "0.2"
mdns-sd = "0.13"
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.13"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs", "macros", "process"] }

[build-dependencies]
prost-build = "0.13"
protox = "0.7"
