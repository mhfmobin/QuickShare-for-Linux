[package]
name = "quickshare-linux"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MH Farahmand <mhfmobin@gmail.com>"]
repository = "https://github.com/mhfmobin/QuickShare-for-Linux"
readme = "../README.md"
description = "Share files and links with nearby Android phones using Quick Share"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
pango = { version = "0.20", features = ["v1_56"] }
pangocairo = "0.20"
qs-core = { path = "../core" }

[package.metadata.deb]
maintainer = "MH Farahmand <mhfmobin@gmail.com>"
section = "net"
depends = "$auto, curl, pkexec"
recommends = "python3-nautilus"
extended-description = "Send and receive files and links with nearby Android phones using Quick Share, over Wi-Fi."
assets = [
  ["target/release/quickshare-linux", "usr/bin/", "755"],
  ["../data/io.github.mhfmobin.QuickShareLinux.desktop", "usr/share/applications/", "644"],
  ["../data/io.github.mhfmobin.QuickShareLinux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../data/fonts/*", "usr/share/quickshare-linux/fonts/", "644"],
  ["../nautilus/quickshare.py", "usr/share/nautilus-python/extensions/", "644"],
]
